spring.application.name=tugascrud-ktp   

# Port default Spring Boot
server.port=8080

# Konfigurasi koneksi ke database 'spring' (sesuai yang kamu buat minggu lalu)
spring.datasource.url=jdbc:mysql://localhost:3306/spring?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect