<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pendataan KTP Modern</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .main-container { padding: 40px 0; }
        .card { 
            border: none; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .card-header {
            background: #4e73df;
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 20px;
            font-weight: 700;
        }
        .btn-success { background-color: #1cc88a; border: none; padding: 12px; border-radius: 10px; font-weight: 600; }
        .btn-success:hover { background-color: #17a673; }
        .table { border-radius: 15px; overflow: hidden; }
        .table thead { background-color: #4e73df; color: white; }
        h2 { font-weight: 800; color: #2e59d9; text-shadow: 2px 2px 4px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="container main-container">
    <h2 class="text-center mb-5">E-KTP DIGITAL MANAGER</h2>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header text-center">
                    <span id="formTitle">PENDAFTARAN BARU</span>
                </div>
                <div class="card-body p-4">
                    <form id="ktpForm">
                        <input type="hidden" id="ktpId">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">NOMOR KTP (NIK)</label>
                            <input type="text" class="form-control form-control-lg" id="nomorKtp" placeholder="16 Digit NIK" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">NAMA LENGKAP</label>
                            <input type="text" class="form-control form-control-lg" id="namaLengkap" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">ALAMAT DOMISILI</label>
                            <textarea class="form-control" id="alamat" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label class="form-label small fw-bold text-muted">TANGGAL LAHIR</label>
                                <input type="date" class="form-control" id="tanggalLahir" required>
                            </div>
                            <div class="col-md-12 mb-4">
                                <label class="form-label small fw-bold text-muted">JENIS KELAMIN</label>
                                <select class="form-select" id="jenisKelamin" required>
                                    <option value="" disabled selected>Pilih...</option>
                                    <option value="Laki-Laki">Laki-Laki</option>
                                    <option value="Perempuan">Perempuan</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 shadow-sm" id="btnSave">SIMPAN DATA</button>
                        <button type="button" class="btn btn-light w-100 mt-2 d-none" id="btnCancel">BATAL EDIT</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-4">NIK</th>
                                    <th>NAMA</th>
                                    <th>ALAMAT</th>
                                    <th>TGL LAHIR</th>
                                    <th>L/P</th>
                                    <th class="text-center">AKSI</th>
                                </tr>
                            </thead>
                            <tbody id="ktpTableBody" class="small">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
